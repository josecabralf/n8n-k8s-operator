[project]
name = "n8n-k8s-operator"
version = "0.0"
requires-python = ">=3.10"

[project.optional-dependencies]
unit = ["ops[testing]~=2.21", "pytest>=8", "coverage[toml]>=7"]
integration = []

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
log_cli_level = "INFO"
testpaths = ["tests/unit"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
