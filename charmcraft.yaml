name: n8n
type: charm
title: n8n
summary: Juju Kubernetes charm for n8n workflow automation.
description: |
  n8n is a source-available workflow automation platform. It connects
  APIs, databases, and internal services through a visual editor, and
  drops down to custom JavaScript or Python when a step needs code.

  Small and medium teams self-host n8n to keep automation and the data
  it touches on their own infrastructure. The upstream n8n Sustainable
  Use License permits internal self-hosting; reselling n8n as a
  multi-tenant SaaS is restricted. Read the upstream licence before
  commercial use.

links:
  source: https://github.com/josecabralf/n8n-k8s-operator
  issues: https://github.com/josecabralf/n8n-k8s-operator/issues

assumes:
  - k8s-api
  - juju >= 3.3

platforms:
  ubuntu@24.04:amd64:

containers:
  n8n:
    resource: n8n-image
    mounts:
      - storage: binary-data
        location: /home/node/.n8n/binaryData

resources:
  n8n-image:
    type: oci-image
    description: OCI image for n8n.
    upstream-source: docker.n8n.io/n8nio/n8n@sha256:c0c39b1ca69d43f736bc65f8ddd70972a8989f736e8a4b6a075823f98cc48a23

peers:
  n8n-peers:
    interface: n8n_peers

storage:
  binary-data:
    type: filesystem
    location: /home/node/.n8n/binaryData
    description: |
      Filesystem storage for n8n workflow binary data (file attachments).
      When attached, n8n switches to filesystem mode; when absent, attachments
      fall back to in-DB storage (suboptimal — see PRD Decision 8).
    minimum-size: 1G

requires:
  logging:
    interface: loki_push_api
    limit: 1
    optional: true
  postgresql:
    interface: postgresql_client
    limit: 1
  ingress:
    interface: ingress
    limit: 1
  s3:
    interface: s3
    limit: 1
  vault-k8s:
    interface: vault-kv
    limit: 1
    optional: true

provides:
  metrics-endpoint:
    interface: prometheus_scrape
  grafana-dashboard:
    interface: grafana_dashboard

config:
  options:
    encryption-key:
      type: secret
      default: ""
      description: |
        Optional Juju user-secret URI (secret:<id>) containing an existing
        N8N_ENCRYPTION_KEY to use instead of the auto-generated one. The
        referenced secret must have a field named `value` and must be
        granted to this application (`juju grant-secret <id> n8n-k8s`).
        Intended for migrating from an existing n8n install. Rotation is
        NOT supported in v1 — changing this after deploy bricks every
        credential stored by n8n.
    log-level:
      type: string
      default: info
      description: |
        n8n log level. Sets N8N_LOG_LEVEL. Must be one of: debug, info,
        warn, error. Invalid values block the unit.
    timezone:
      type: string
      default: UTC
      description: |
        IANA timezone name. Sets BOTH GENERIC_TIMEZONE (used by n8n
        scheduling) and TZ (process timezone). Defaults to UTC.
    executions-data-prune:
      type: boolean
      default: false
      description: |
        If true, n8n periodically deletes execution data older than
        executions-data-max-age-hours. Sets EXECUTIONS_DATA_PRUNE.
    executions-data-max-age-hours:
      type: int
      default: 336
      description: |
        Maximum age in hours of execution data retained when
        executions-data-prune is true. Sets EXECUTIONS_DATA_MAX_AGE.
        Must be >= 0; default 336 (14 days) matches n8n upstream.
    executions-data-save-on-error:
      type: string
      default: all
      description: |
        Whether to persist execution data for failed runs. One of
        "all" or "none". Sets EXECUTIONS_DATA_SAVE_ON_ERROR.
    executions-data-save-on-success:
      type: string
      default: all
      description: |
        Whether to persist execution data for successful runs. One of
        "all" or "none". Sets EXECUTIONS_DATA_SAVE_ON_SUCCESS.
    executions-data-save-on-progress:
      type: boolean
      default: false
      description: |
        If true, n8n saves intermediate node data during runs. Sets
        EXECUTIONS_DATA_SAVE_ON_PROGRESS.
    disable-user-registration:
      type: boolean
      default: false
      description: |
        If true, disables n8n public user signup. Sets
        N8N_USER_MANAGEMENT_DISABLED.
    environment:
      type: string
      default: ""
      description: |
        Tier 3 escape hatch for additional n8n env vars without rebuilding
        the charm. YAML body with three sub-keys:

          env:
            - name: N8N_FOO
              value: bar
          juju:
            - secret-id: secret:abc
              name: N8N_BAZ
              key: token
          vault:
            - path: myapp
              name: N8N_API_TOKEN
              key: api_token

        Charm-managed env vars (database, encryption key, ingress URLs,
        S3, metrics, binary-data mode, and all Tier 1/Tier 2 typed configs)
        take precedence over entries here. Conflicting keys are dropped
        and surfaced in the unit status; per-key remediation hints land
        in `juju debug-log`.

        `vault:` entries are resolved at runtime against the `vault-k8s`
        relation; if `vault:` entries are present but no vault-k8s
        relation is joined the unit goes Blocked.
        Precedence within user-supplied entries (last-writer-wins on
        collision): vault > juju > env.
    smtp-host:
      type: string
      default: ""
      description: |
        SMTP server hostname. Sets N8N_SMTP_HOST. Required together with
        smtp-user and smtp-password to enable outbound mail.
    smtp-port:
      type: int
      default: 587
      description: |
        SMTP server port. Sets N8N_SMTP_PORT. Must be 1–65535. Default
        587 (submission). Used only when smtp-host/user/password are set.
    smtp-user:
      type: string
      default: ""
      description: |
        SMTP authentication username. Sets N8N_SMTP_USER. Required
        together with smtp-host and smtp-password.
    smtp-password:
      type: secret
      default: ""
      description: |
        Juju user-secret URI (secret:<id>) containing the SMTP password
        under field 'value'. Required together with smtp-host and
        smtp-user. Must be granted to this app
        (`juju grant-secret <id> n8n-k8s`).
    smtp-sender:
      type: string
      default: ""
      description: |
        Envelope From address for outbound mail. Sets N8N_SMTP_SENDER.
        Optional; if empty the variable is omitted.
    smtp-ssl-tls:
      type: boolean
      default: false
      description: |
        If true, use implicit TLS for SMTP (port 465 style). Sets
        N8N_SMTP_SSL.
    task-runner:
      type: boolean
      default: false
      description: |
        Enables the n8n internal task runner (child-process node
        execution); sets N8N_RUNNERS_ENABLED. Independent of queue mode.
    runner-max-concurrency:
      type: int
      default: 5
      description: |
        Sets N8N_RUNNERS_MAX_CONCURRENCY; applied only when task-runner
        is true. Must be >= 1.
    runner-process-timeout:
      type: int
      default: 300
      description: |
        Sets N8N_RUNNERS_TASK_TIMEOUT (max seconds for a single task);
        applied only when task-runner is true. Must be >= 1.

actions:
  get-encryption-key:
    description: |
      Print the current effective N8N_ENCRYPTION_KEY. Store this offsite
      for disaster recovery — losing this key bricks every credential
      stored in n8n's database.
  create-admin:
    description: |
      Create the n8n initial owner. Idempotent: fails if an owner has
      already been bootstrapped. Must run on the leader.
    params:
      email:
        type: string
      password:
        type: string
        description: |
          Plaintext password for the new owner. NOTE: appears in
          `juju show-operation` logs until rotated out of action history.
      first-name:
        type: string
      last-name:
        type: string
    required: [email, password, first-name, last-name]
  restart:
    description: |
      Restart the n8n workload container. Pebble stops and starts the n8n
      service; the unit is not reconfigured. Safe to run at any time, but
      in-flight workflow executions are interrupted.

parts:
  charm:
    plugin: charm
    source: .
    charm-binary-python-packages:
      - bcrypt~=4.2
      - ops-scenario>=7.0.1,<8.0.0
      - pytest-interface-tester
      - pydantic
    override-prime: |
      craftctl default
      chmod +x src/charm.py
